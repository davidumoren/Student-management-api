
name: Student Management API CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-build-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d student_management_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/student_management_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/student_management_test
      IMAGE_NAME: ghcr.io/davidumoren/student-management-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest -v tests/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            ghcr.io/davidumoren/student-management-api:${{ github.sha }}
            ghcr.io/davidumoren/student-management-api:latest

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/davidumoren/student-management-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate Software Bill of Materials
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/davidumoren/student-management-api:${{ github.sha }}
          format: cyclonedx
          output: student-api-sbom.json
          exit-code: "0"
          skip-setup-trivy: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: student-api-sbom-${{ github.sha }}
          path: student-api-sbom.json
          if-no-files-found: error
          retention-days: 30

      - name: Save scanned Docker image
        run: |
          docker save \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            -o student-api-image.tar

      - name: Upload scanned Docker image
        uses: actions/upload-artifact@v7
        with:
          name: student-api-image-${{ github.sha }}
          path: student-api-image.tar
          if-no-files-found: error
          retention-days: 1

  publish-sign:
    if: github.event_name == 'push'
    needs: test-build-scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      IMAGE_NAME: ghcr.io/davidumoren/student-management-api

    steps:
      - name: Download scanned Docker image
        uses: actions/download-artifact@v8
        with:
          name: student-api-image-${{ github.sha }}

      - name: Load scanned Docker image
        run: docker load -i student-api-image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore latest image tag
        run: |
          docker tag \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            "$IMAGE_NAME:latest"

      - name: Publish scanned image to GHCR
        run: |
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:latest"

      - name: Get published image digest
        run: |
          IMAGE_DIGEST=$(docker buildx imagetools inspect \
            "$IMAGE_NAME:${GITHUB_SHA}" \
            --format '{{.Manifest.Digest}}')

          if [ -z "$IMAGE_DIGEST" ]; then
            echo "ERROR: Could not retrieve image digest."
            exit 1
          fi

          IMAGE_REF="$IMAGE_NAME@$IMAGE_DIGEST"

          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
          echo "Published image: $IMAGE_REF"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Sign container image
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify container image signature
        run: |
          cosign verify "$IMAGE_REF" \
            --certificate-identity-regexp '^https://github\.com/davidumoren/Student-management-api/\.github/workflows/ci\.yml@refs/heads/(main|master)$' \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
